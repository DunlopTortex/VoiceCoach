name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests
        run: npm test

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Browser test (virtual singer)
        run: |
          python3 -m http.server 4466 >/dev/null 2>&1 &
          sleep 1
          mkdir -p screenshots
          BASE_URL=http://localhost:4466/ SCREENSHOTS=screenshots node tests/e2e.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

  deploy:
    # Publish only from main, and only when the tests pass.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the app files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest icon.svg sw.js css js _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
